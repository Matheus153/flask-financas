{% extends "base.html" %}

{% block content %}
<h2>Adicionar Transação</h2>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="descricao" class="form-label">Descrição</label>
        <input type="text" class="form-control" id="descricao" name="descricao" maxlength="100" required>
    </div>

    <div class="mb-3">
        <label for="valor" class="form-label">Valor em (R$)</label>
        <input type="number" step="0.01" class="form-control" id="valor" name="valor" required>
    </div>

    <div class="mb-3">
        <label for="tipo" class="form-label">Tipo</label>
        <select class="form-select" id="tipo" name="tipo" required>
            <option value="receita">Receita</option>
            <option value="despesa">Despesa</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="categoria" class="form-label">Categoria</label>
        <select class="form-select" id="categoria" name="categoria" required>
            {% for categoria in categorias %}
            <option value="{{ categoria.id }}">{{ categoria.nome }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="data" class="form-label">Data</label>
        <input type="datetime-local" class="form-control" id="data" name="data" required
            value="{{ datetime.now().strftime('%Y-%m-%dT%H:%M') }}">
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="recorrente" name="recorrente">
        <label class="form-check-label" for="recorrente">
            Repetir mensalmente por 1 ano
        </label>
    </div>

    <button type="submit" class="btn btn-primary mt-2 mb-4">Salvar</button>
    <a href="{{ url_for('.index') }}" class="btn btn-outline-secondary mt-2 mb-4">Cancelar</a>
</form>
{% endblock %}
