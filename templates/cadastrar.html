{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Cadastra-se gratuitamente</h2>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4">
        <label>Nome Completo</label>
        <input type="text" name="fullname" class="form-control" maxlength="100" required>
    </div>

    <div class="mb-4">
        <label>Email</label>
        <input type="email" name="email" class="form-control" maxlength="100" value="{{ email|default('', true) }}"
            required>
    </div>

    <div class="mb-4">
        <label>Senha</label>
        <input type="password" name="password" maxlength="100" class="form-control mb-3" required>
        <small class="form-text text-muted">
            Requisitos:
            <ul>
                <li>Mínimo 6 caracteres</li>
                <li>Pelo menos uma letra maiúscula</li>
                <li>Pelo menos um caractere especial</li>
                <li>Pelo menos um número</li>
            </ul>
        </small>
    </div>

    <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="aceitarTermos" name="aceitar_termos" required>
        <label class="form-check-label" for="aceitarTermos">
            Li e aceito os <a class="link-blue" href="{{ url_for('main.termos_condicoes') }}" target="_blank">Termos de
                Uso</a> e
            <a class="link-blue" href="{{ url_for('main.politica_privacidade') }}" target="_blank">Política de
                Privacidade</a>
        </label>
    </div>

    <button type="submit" class="btn btn-primary">Cadastrar</button>

    <div class="subscribe">
        <label>Já tem conta?</label>
        <a class=" link-blue" href="{{ url_for('main.login') }}" class="btn btn-link">
            <i class="bi bi-box-arrow-right me-2"></i>Faça login</a>
    </div>
</form>
{% endblock %}
