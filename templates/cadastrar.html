{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Cadastra-se gratuitamente</h2>
<form method="POST">
    <div class="mb-3">
        <label>Nome Completo</label>
        <input type="text" name="fullname" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control" value="{{ email|default('', true) }}" required>
    </div>

    <div class="mb-3">
        <label>Senha</label>
        <input type="password" name="password" class="form-control" required>
        <small class="form-text text-muted">
            Requisitos:
            <ul>
                <li>Mínimo 6 caracteres</li>
                <li>Pelo menos uma letra maiúscula</li>
                <li>Pelo menos um caractere especial</li>
            </ul>
        </small>
    </div>

    <button type="submit" class="btn btn-primary">Cadastrar</button>
    <a class="link-blue" href="{{ url_for('main.login') }}" class="btn btn-link">Já tem conta? Faça login</a>
</form>
{% endblock %}
