{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0">
                Editar Perfil
            </h4>
        </div>

        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-4">
                    <label class="form-label">Método de Login:</label>
                    <input type="text" class="form-control" value="{{ provider|capitalize }}" readonly>
                </div>

                <div class="mb-4">
                    <label for="nome" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" id="nome" name="nome" value="{{ nome_atual }}" required
                        minlength="2" maxlength="100">
                    <div class="form-text">Mínimo 2 caracteres, máximo 100</div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Salvar Alterações
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
